<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sprint 3 - Gestão de Produtos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CABEÇALHO -->
<header>
    <h1>📦 Sistema de Produtos (Sprint 3)</h1>
    <div id="user-info" class="user-info hidden">
        <span>👤 <strong id="user-nome"></strong></span>
        <button id="btn-logout" class="btn-danger" onclick="logout()">Sair</button>
    </div>
</header>

  <main class="container">
    <!-- TELA DE AUTENTICAÇÃO (LOGIN / CADASTRO) -->
    <section id="auth-section" class="card">
      <div class="tabs">
        <button id="tab-login" class="active" onclick="alternarAba('login')">Login</button>
        <button id="tab-registro" onclick="alternarAba('registro')">Criar Conta</button>
      </div>

      <!-- Formulário de Login -->
      <form id="form-login" onsubmit="fazerLogin(event)">
        <h2>Entrar no Sistema</h2>
        <input type="email" id="login-email" placeholder="E-mail" required>
        <input type="password" id="login-senha" placeholder="Senha" required>
        <button type="submit" class="btn-primary">Entrar</button>
      </form>

      <!-- Formulário de Registro -->
      <form id="form-registro" class="hidden" onsubmit="fazerRegistro(event)">
        <h2>Novo Usuário</h2>
        <input type="text" id="reg-nome" placeholder="Nome completo" required>
        <input type="email" id="reg-email" placeholder="E-mail" required>
        <input type="password" id="reg-senha" placeholder="Senha (mín. 6 caracteres)" minlength="6" required>
        <button type="submit" class="btn-primary">Cadastrar</button>
      </form>

      <p id="auth-msg" class="msg"></p>
    </section>

    <!-- TELA DO PAINEL DE PRODUTOS (PROTEGIDA) -->
    <section id="app-section" class="hidden">
      <!-- Formulário de Cadastro / Edição -->
      <div class="card">
        <h2 id="form-produto-titulo">Cadastrar Novo Produto</h2>
        <form id="form-produto" onsubmit="salvarProduto(event)">
          <input type="hidden" id="produto-id">
          <div class="grid-form">
            <input type="text" id="prod-nome" placeholder="Nome do produto" required>
            <input type="text" id="prod-descricao" placeholder="Descrição (máx. 40 caracteres)" maxlength="40" required>
            <input type="number" id="prod-preco" placeholder="Preço (ex: 250.90)" step="0.01" min="0.01" required>
            <input type="number" id="prod-estoque" placeholder="Estoque" min="1" required>
          </div>
          <div class="actions">
            <button type="submit" class="btn-primary" id="btn-salvar-produto">Salvar Produto</button>
            <button type="button" class="btn-secondary hidden" id="btn-cancelar-edicao" onclick="cancelarEdicao()">Cancelar Edição</button>
          </div>
        </form>
        <p id="prod-msg" class="msg"></p>
      </div>

      <!-- Lista de Produtos -->
      <div class="card">
        <div class="list-header">
          <h2>Produtos Cadastrados</h2>
          <div class="actions">
            <button class="btn-secondary" onclick="carregarProdutos()">🔄 Atualizar</button>
            <button class="btn-primary" onclick="baixarPdfEstoque()">📄 Gerar PDF</button>
          </div>
        </div>

        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Descrição</th>
                <th>Preço</th>
                <th>Estoque</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tabela-produtos"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
